[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "foodbolt-restaurants"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "httpx>=0.28",
    "spectral-sdk @ git+https://github.com/cap-theorem/spectral-python.git@main",
]

[project.scripts]
restaurants = "restaurants.__main__:main"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/restaurants"]
