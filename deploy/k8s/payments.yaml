apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments
  labels:
    app: payments
spec:
  replicas: 2
  selector:
    matchLabels:
      app: payments
  template:
    metadata:
      labels:
        app: payments
    spec:
      terminationGracePeriodSeconds: 15
      initContainers:
        - name: spctrld
          image: spctrld:dev
          imagePullPolicy: IfNotPresent
          restartPolicy: Always
          ports:
            - name: quic
              containerPort: 7000
              protocol: UDP
          env:
            - name: LOG_FORMAT
              value: json
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          args:
            - "--listen-addr=$(POD_IP):7000"
            - "--api-port=8000"
            - "--bootstrap=spctrld-peers.spectral.svc.cluster.local:7000"
      containers:
        - name: payments
          image: ghcr.io/cap-theorem/foodbolt-payments:main
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8083
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: MACHINE
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: ADVERTISE_URL
              value: "http://$(POD_IP):8083"
            - name: TIME_SCALE
              value: "1.0"
            - name: PAYMENTS_FAILURE_RATE
              value: "0"
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            failureThreshold: 6
